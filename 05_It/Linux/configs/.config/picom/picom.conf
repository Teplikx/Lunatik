backend = "glx";
vsync = true;

corner-radius = 10;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'dmenu'",
    "class_g = 'dwm'",

    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

opacity-rule = [
  "75:class_g = 'obsidian'",
  "75:class_g = 'lite-xl'",
  "75:class_g = 'st-256color'",
  "75:class_g = 'dwm'",
  "75:class_g = 'dmenu'"
];

fading = true;
fade-in-step = 0.02;     
fade-out-step = 0.02;   
fade-delta = 5;       

animations = true;

animation-stiffness = 180.0;
animation-dampening = 25.0;
animation-window-mass = 0.7;

animation-for-open-window = "zoom";
animation-for-unmap-window = "fade";
animation-for-transient-window = "fade";
animation-for-workspace-switch-in = "fade";
animation-for-workspace-switch-out = "fade";
